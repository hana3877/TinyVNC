
name: Build TinyVNC CIA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check 3DS compiler
        run: |
          echo "DEVKITARM=$DEVKITARM"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version

      - name: Install CIA tools
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/cia-tools"

          curl -fL \
            https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip \
            -o /tmp/bannertool.zip

          unzip -jo /tmp/bannertool.zip \
            linux-x86_64/bannertool \
            -d "$HOME/cia-tools"

          chmod +x "$HOME/cia-tools/bannertool"

          echo "Building makerom from source"

          git clone --recursive \
            https://github.com/3DSGuy/Project_CTR.git \
            /tmp/Project_CTR

          cd /tmp/Project_CTR
          make -C makerom deps program

          cp makerom/bin/makerom "$HOME/cia-tools/makerom"
          chmod +x "$HOME/cia-tools/makerom"

          echo "Checking CIA tools"
          ls -lh "$HOME/cia-tools"
          ldd "$HOME/cia-tools/makerom"

      - name: Build TinyVNC
        shell: bash
        run: |
          set -e
          export PATH="$HOME/cia-tools:$DEVKITARM/bin:$PATH"

          command -v bannertool
          command -v makerom

          make -j2

      - name: Upload CIA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TinyVNC-CIA
          path: "*.cia"
          if-no-files-found: error
