
name: Build TinyVNC CIA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check 3DS development tools
        run: |
          echo "DEVKITARM=$DEVKITARM"
          ls -l "$DEVKITARM/bin/arm-none-eabi-gcc"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
          command -v dkp-pacman
          
      - name: Install CIA tools
        run: |
          dkp-pacman -S --needed --noconfirm 3ds-tools
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          command -v bannertool
          command -v makerom

      - name: Build TinyVNC
        run: |
          export PATH="/opt/devkitpro/tools/bin:$DEVKITARM/bin:$PATH"
          make -j2

      - name: Upload CIA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TinyVNC-CIA
          path: "*.cia"
          if-no-files-found: error
