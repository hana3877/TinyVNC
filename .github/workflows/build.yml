
name: Build TinyVNC CIA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check 3DS development tools
        run: |
          echo "DEVKITARM=$DEVKITARM"
          ls -l "$DEVKITARM/bin/arm-none-eabi-gcc"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version

      - name: Install CIA tools
        run: |
          mkdir -p "$HOME/cia-tools"

          curl -fL \
            https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip \
            -o /tmp/bannertool.zip

          unzip -jo /tmp/bannertool.zip \
            linux-x86_64/bannertool \
            -d "$HOME/cia-tools"

          curl -fL \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip \
            -o /tmp/makerom.zip

          unzip -jo /tmp/makerom.zip \
            makerom \
            -d "$HOME/cia-tools"

          chmod +x "$HOME/cia-tools/bannertool"
          chmod +x "$HOME/cia-tools/makerom"

          ls -lh "$HOME/cia-tools"

      - name: Build TinyVNC
        run: |
          export PATH="$HOME/cia-tools:$DEVKITARM/bin:$PATH"

          command -v bannertool
          command -v makerom

          make -j2

      - name: Upload CIA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TinyVNC-CIA
          path: "*.cia"
          if-no-files-found: error
